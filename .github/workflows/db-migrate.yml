name: Apply DB Migrations

# Migrations apply automatically when they reach master, so nobody has to run
# `supabase db push` by hand. Running it from a feature branch applies migrations
# that exist on no other branch, which leaves the remote migration history ahead
# of master and blocks every later push (see scripts/guard-db-push.mjs).
# workflow_dispatch stays for re-runs and manual repairs.
on:
  workflow_dispatch:
    inputs:
      allow_non_master:
        description: "DANGER: apply migrations from a non-master branch. Leave unchecked."
        type: boolean
        default: false
  push:
    branches: [master]
    paths:
      - "supabase/migrations/**"

# One migration run at a time — this writes to the database the live app uses.
# A merge landing while a dispatch is mid-push would interleave two `db push`
# runs against the same migration history.
concurrency:
  group: db-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: fandqafngybfdyslofmr
    steps:
      # The dispatch UI lets you pick any branch, and this workflow writes to the
      # SHARED PRODUCTION database. Running it on a feature branch applies
      # migrations that exist on no other branch: the remote migration history
      # then holds versions master has never seen, and every later run fails with
      # "Remote migration versions not found in local migrations directory".
      # That happened on 2026-07-29 and took a manual repair to undo.
      - name: Refuse to run off master
        if: github.ref != 'refs/heads/master' && inputs.allow_non_master != true
        run: |
          echo "::error::Apply DB Migrations must run on master. You selected '${{ github.ref_name }}'."
          echo "Merge the migration to master — this workflow then runs on its own."
          echo "If you genuinely must apply from a branch, re-run with allow_non_master checked,"
          echo "and be ready to copy the migration files onto master straight afterwards."
          exit 1

      - uses: actions/checkout@v4

      # Supabase identifies a migration by its 14-digit version prefix ALONE, not
      # by filename. Two branches that stamp the same second produce files that
      # look distinct but collide: applying one marks the other's version as done,
      # so it is skipped forever — no error, green run, missing column. That has
      # already happened here, so it is checked before anything is applied.
      #
      # No `inputs` in this step on purpose: it must hold for the push trigger
      # too, where the inputs context is null.
      - name: Reject duplicate migration versions
        run: |
          set -euo pipefail
          dupes=$(ls -1 supabase/migrations/*.sql \
            | xargs -r -n1 basename \
            | cut -c1-14 \
            | sort \
            | uniq -d)
          if [ -n "$dupes" ]; then
            echo "::error::Two migrations share a version prefix. Supabase keys on that number alone, so one would be silently skipped."
            for v in $dupes; do
              echo "  version $v:"
              ls -1 supabase/migrations/${v}*.sql | sed 's/^/    /'
            done
            echo "Fix: renumber the newer file to a timestamp after every applied migration."
            exit 1
          fi
          echo "All migration versions are unique."

      - uses: supabase/setup-cli@v1
        env:
          # "version: latest" resolves the release via the GitHub API; without a
          # token that call is anonymous and rate-limited per runner IP — it
          # failed twice on 2026-08-03 with "rate limit exceeded".
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      # Local vs remote side by side, so the log records which versions were
      # pending before the push — worth having when reading a failed run later.
      - name: List migrations
        run: supabase migration list --linked

      - name: Push migrations
        run: supabase db push --include-all
